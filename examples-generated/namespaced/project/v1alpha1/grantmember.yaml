apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: GrantMember
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/grantmember
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    grantIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_org
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_project
    roles:
    - PROJECT_GRANT_OWNER
    userId: ${data.zitadel_human_user.default.id}
