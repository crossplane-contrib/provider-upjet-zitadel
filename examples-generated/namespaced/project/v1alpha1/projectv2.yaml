apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: ProjectV2
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/projectv2
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    hasProjectCheck: true
    name: projectname
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_org
    privateLabelingSetting: PRIVATE_LABELING_SETTING_ENFORCE_PROJECT_RESOURCE_OWNER_POLICY
    projectRoleAssertion: true
    projectRoleCheck: true
