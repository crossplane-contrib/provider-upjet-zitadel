apiVersion: application.zitadel.m.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: application/v1alpha1/application
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    name: applicationv2
    oidc:
    - accessTokenRoleAssertion: false
      accessTokenType: OIDC_TOKEN_TYPE_BEARER
      additionalOrigins: []
      appType: OIDC_APP_TYPE_WEB
      authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
      clockSkew: 0s
      devMode: true
      grantTypes:
      - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
      idTokenRoleAssertion: false
      idTokenUserinfoAssertion: false
      postLogoutRedirectUris:
      - https://localhost.com
      redirectUris:
      - https://localhost.com
      responseTypes:
      - OIDC_RESPONSE_TYPE_CODE
      skipNativeAppSuccessPage: false
      version: OIDC_VERSION_1_0
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_org
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_project
